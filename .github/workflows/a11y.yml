name: ORBITA accessibility (Chromium + axe-core)
on:
  pull_request:
    paths:
      - 'hub/static/**'
      - 'tests/browser_orbita_a11y.py'
      - '.github/workflows/a11y.yml'
  push:
    branches: [main]
    paths:
      - 'hub/static/**'
      - 'tests/browser_orbita_a11y.py'
      - '.github/workflows/a11y.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install CI-only browser and accessibility tools
        run: |
          python -m pip install -e '.[test]'
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts 'axe-core@^4.10'
      - name: Run axe WCAG A-AA against real private local server
        run: python tests/browser_orbita_a11y.py
