name: ORBITA browser E2E
on:
  pull_request:
    paths:
      - 'hub/**'
      - 'tests/browser_orbita_e2e.py'
      - 'tests/browser_nexo_e2e.py'
      - '.github/workflows/browser.yml'
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - 'tests/browser_orbita_e2e.py'
      - 'tests/browser_nexo_e2e.py'
      - '.github/workflows/browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test-only browser tools
        run: |
          python -m pip install -e '.[test,backup]'
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Real browser journeys against temporary FastAPI
        run: |
          python tests/browser_orbita_e2e.py
          python tests/browser_nexo_e2e.py
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: orbita-fictional-screenshots
          path: test-artifacts/orbita/
          if-no-files-found: ignore
          retention-days: 7
