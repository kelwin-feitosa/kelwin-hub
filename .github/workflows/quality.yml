name: Kelwin Hub quality
on:
  push:
    branches:
      - 'feat/**'
      - main
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install with test and backup extras
        run: python -m pip install -e '.[test,backup]'
      - name: Regression, integration and backup tests with Python branch coverage
        run: python -m coverage run --branch --source=hub -m pytest -q --disable-warnings
      - name: Report honest Python coverage and generate Cobertura XML
        run: |
          python -m coverage report -m
          python -m coverage xml -o coverage.xml
      - name: Retain Python coverage report for future Sonar CI-based integration
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Rehearse encrypted backup, upgrade and restore on synthetic v7 DB
        run: python scripts/rehearse_upgrade.py
      - name: Synthetic HTTP latency and payload evidence (informational only)
        run: python scripts/benchmark_http.py --tasks 1000 --iterations 20
      - name: Search equivalence and performance evidence (synthetic, informational)
        run: python scripts/benchmark_search.py
      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q hub scripts
          node --check hub/static/app.js
          node --check hub/static/orbita-navigation.js
          node --check hub/static/nexo-context.js
          node --check hub/static/nexo-suggestions.js
          node --check hub/static/meeting-review.js
          node --check hub/static/availability-ui.js
          node tests/ui_sanity.cjs
          node tests/orbita_ui_sanity.cjs
          node tests/nexo_ui_sanity.cjs
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
