name: Security dependencies (ORBITA)
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'hub/**'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'hub/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and scanner (CI only)
        run: |
          python -m pip install -e '.[backup]'
          python -m pip install 'pip-audit>=2,<3'
      - name: Scan installed dependencies for published advisories
        run: python -m pip_audit --local --progress-spinner off
