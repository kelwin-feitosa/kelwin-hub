name: Security dependencies (ORBITA)
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'hub/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'hub/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and scanner (CI only)
        run: |
          python -m pip install -e '.[backup]'
          python -m pip install 'pip-audit>=2,<3'
      - name: Scan installed dependencies for published advisories
        run: python -m pip_audit --local --progress-spinner off
