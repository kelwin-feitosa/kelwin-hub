# Optional: docker compose -f compose.yaml -f compose.n8n.yaml --profile automations up -d
services:
  n8n:
    profiles: ["automations"]
    image: docker.n8n.io/n8nio/n8n:2.47.4
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configure a chave de criptografia do n8n no .env antes}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    restart: unless-stopped
volumes:
  n8n_data:
