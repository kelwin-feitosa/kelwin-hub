services:
  hub:
    build: .
    env_file: .env
    environment:
      HUB_DB_PATH: /app/data/hub.db
    volumes:
      - hub_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  hub_data:
