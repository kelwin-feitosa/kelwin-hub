[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kelwin-hub-local"
version = "0.1.0"
description = "Piloto local de organização e automação pessoal"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
backup = ["cryptography>=42,<50"]
[tool.setuptools.packages.find]
include = ["hub*"]
[tool.setuptools.package-data]
hub = ["static/*"]
